events {
    worker_connections 1024;
}

http {
    # Two API containers, four Uvicorn workers each. This matches production.
    #
    # max_fails and fail_timeout give us passive health checking: after 3 failed
    # requests inside 10 seconds, nginx stops sending traffic to that container
    # and then tries it again after 10 seconds. This is the same in-and-out
    # behaviour the load balancer shows in production.
    upstream api_pool {
        server api-1:8000 max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
    }

    # The production load balancer has a 30 second idle timeout. This matches it.
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;

    log_format main '$remote_addr [$time_local] "$request" '
                    'status=$status upstream=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'request_time=$request_time';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server {
        listen 80;

        # Do not retry on timeout. The production load balancer does not retry
        # either. A timeout returns 504 to the caller.
        proxy_next_upstream off;

        location / {
            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
